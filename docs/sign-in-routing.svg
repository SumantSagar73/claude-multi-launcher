<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Segoe UI, system-ui, -apple-system, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Sign-in routing</title>
  <desc id="d">A browser sign-in for a second account is handed by Windows to the Default Claude; the launcher reads the link from that process and forwards it to the account window that started the sign-in.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#e8a23a"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#8f877c"/></marker>
    <style>
      .t { fill:#ece6dd; font-size:14px; paint-order:stroke; stroke:#1c1916; stroke-width:5px; stroke-linejoin:round; }
      .s { fill:#a39b90; font-size:12px; paint-order:stroke; stroke:#1c1916; stroke-width:5px; stroke-linejoin:round; }
      .h { fill:#ece6dd; font-size:15px; font-weight:600; }
      .life { stroke:#4a443d; stroke-width:1.5; stroke-dasharray:5 6; }
      .note { fill:#302b26; stroke:#5a5349; }
    </style>
  </defs>

  <rect width="1000" height="560" rx="16" fill="#1c1916"/>

  <!-- lifelines -->
  <g class="life">
    <line x1="100" y1="72" x2="100" y2="530"/><line x1="300" y1="72" x2="300" y2="530"/><line x1="500" y1="72" x2="500" y2="530"/>
    <line x1="700" y1="72" x2="700" y2="530"/><line x1="900" y1="72" x2="900" y2="530"/>
  </g>

  <!-- participants -->
  <g>
    <rect x="30" y="24" width="140" height="48" rx="10" fill="#26221e" stroke="#5a5349"/><text class="h" x="100" y="53" text-anchor="middle">Browser</text>
    <rect x="230" y="24" width="140" height="48" rx="10" fill="#26221e" stroke="#5a5349"/><text class="h" x="300" y="53" text-anchor="middle">Windows</text>
    <rect x="430" y="24" width="140" height="48" rx="10" fill="#26221e" stroke="#5a5349"/><text class="h" x="500" y="46" text-anchor="middle">Default</text><text class="h" x="500" y="63" text-anchor="middle">Claude</text>
    <rect x="630" y="24" width="140" height="48" rx="10" fill="#3a3024" stroke="#e8a23a"/><text class="h" x="700" y="53" text-anchor="middle">Launcher</text>
    <rect x="830" y="24" width="140" height="48" rx="10" fill="#26221e" stroke="#5a5349"/><text class="h" x="900" y="46" text-anchor="middle">Account</text><text class="h" x="900" y="63" text-anchor="middle">window (X)</text>
  </g>

  <!-- 1 -->
  <line x1="900" y1="120" x2="100" y2="120" stroke="#8f877c" stroke-width="2" marker-end="url(#g)"/>
  <text class="t" x="500" y="112" text-anchor="middle">1  opens the sign-in page in your browser</text>
  <text class="s" x="500" y="140" text-anchor="middle">Claude logs: [Auth] Using system browser</text>

  <!-- 2 -->
  <rect class="note" x="590" y="160" width="220" height="44" rx="8"/>
  <text class="t" x="700" y="180" text-anchor="middle" style="stroke:none">2  sees that log line,</text>
  <text class="t" x="700" y="197" text-anchor="middle" style="stroke:none">starts watching for the link</text>

  <!-- 3 -->
  <line x1="100" y1="250" x2="300" y2="250" stroke="#e8a23a" stroke-width="2" marker-end="url(#a)"/>
  <text class="t" x="200" y="242" text-anchor="middle">3  sign-in done:</text>
  <text class="s" x="200" y="270" text-anchor="middle">opens claude://login/...</text>

  <!-- 4 -->
  <line x1="300" y1="315" x2="500" y2="315" stroke="#e8a23a" stroke-width="2" marker-end="url(#a)"/>
  <text class="t" x="400" y="307" text-anchor="middle">4  starts Claude.exe</text>
  <text class="s" x="400" y="335" text-anchor="middle">with the link (always Default)</text>

  <!-- 5 -->
  <rect class="note" x="590" y="355" width="220" height="60" rx="8"/>
  <text class="t" x="700" y="376" text-anchor="middle" style="stroke:none">5  sees that new process,</text>
  <text class="t" x="700" y="393" text-anchor="middle" style="stroke:none">reads the link from its</text>
  <text class="t" x="700" y="410" text-anchor="middle" style="stroke:none">command line</text>

  <!-- 6 -->
  <line x1="700" y1="455" x2="900" y2="455" stroke="#e8a23a" stroke-width="2" marker-end="url(#a)"/>
  <text class="t" x="800" y="447" text-anchor="middle">6  forwards the link</text>
  <text class="s" x="800" y="475" text-anchor="middle">--user-data-dir=X &lt;link&gt;</text>

  <!-- 7 and 8 -->
  <rect class="note" x="405" y="490" width="190" height="34" rx="8"/>
  <text class="s" x="500" y="512" text-anchor="middle" style="stroke:none">7  ignores it (didn't ask)</text>
  <rect class="note" x="805" y="490" width="190" height="34" rx="8" style="stroke:#7cc79a"/>
  <text class="t" x="900" y="512" text-anchor="middle" style="stroke:none">8  sign-in completes</text>
</svg>
