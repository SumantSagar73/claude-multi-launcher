<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" font-family="Segoe UI, system-ui, -apple-system, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Architecture overview</title>
  <desc id="d">The launcher's main process starts Claude Desktop with a separate data folder per account, shows the UI in a renderer window, and uses two PowerShell helpers: one watches for sign-in links, the other styles, trims and tiles account windows.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#e8a23a"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#8f877c"/></marker>
    <style>
      .t { fill:#ece6dd; font-size:14px; }
      .s { fill:#a39b90; font-size:12px; }
      .h { fill:#ece6dd; font-size:16px; font-weight:600; }
      .lbl { fill:#a39b90; font-size:12px; paint-order:stroke; stroke:#1c1916; stroke-width:5px; stroke-linejoin:round; }
      .box { fill:#26221e; stroke:#5a5349; }
      .core { fill:#3a3024; stroke:#e8a23a; stroke-width:1.5; }
      .claude { fill:#2a2622; stroke:#6fa8dc; }
    </style>
  </defs>

  <rect width="1000" height="540" rx="16" fill="#1c1916"/>

  <!-- renderer -->
  <rect class="box" x="30" y="60" width="230" height="92" rx="12"/>
  <text class="h" x="145" y="92" text-anchor="middle">Renderer window</text>
  <text class="s" x="145" y="114" text-anchor="middle">account list, settings</text>
  <text class="s" x="145" y="132" text-anchor="middle">plain HTML, CSS, JS</text>

  <!-- main -->
  <rect class="core" x="330" y="40" width="340" height="132" rx="14"/>
  <text class="h" x="500" y="74" text-anchor="middle">Launcher (Electron main process)</text>
  <text class="s" x="500" y="98" text-anchor="middle">accounts and settings  •  tray  •  hotkeys</text>
  <text class="s" x="500" y="118" text-anchor="middle">decides where a sign-in link goes</text>
  <text class="s" x="500" y="138" text-anchor="middle">auto-trim, auto-close, --open shortcuts</text>

  <!-- helpers -->
  <rect class="box" x="730" y="24" width="240" height="78" rx="12"/>
  <text class="h" x="850" y="54" text-anchor="middle">Link watcher</text>
  <text class="s" x="850" y="76" text-anchor="middle">PowerShell + C#, every 20 ms</text>
  <text class="s" x="850" y="92" text-anchor="middle">sees new Claude processes</text>

  <rect class="box" x="730" y="118" width="240" height="78" rx="12"/>
  <text class="h" x="850" y="148" text-anchor="middle">Window helper</text>
  <text class="s" x="850" y="170" text-anchor="middle">PowerShell + C#</text>
  <text class="s" x="850" y="186" text-anchor="middle">icon, title, taskbar, trim, tile</text>

  <!-- arrows top -->
  <line x1="260" y1="106" x2="330" y2="106" stroke="#e8a23a" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <text class="lbl" x="295" y="96" text-anchor="middle">IPC</text>
  <line x1="730" y1="63" x2="670" y2="63" stroke="#8f877c" stroke-width="2" marker-end="url(#g)"/>
  <text class="lbl" x="700" y="55" text-anchor="middle">links</text>
  <line x1="670" y1="152" x2="730" y2="152" stroke="#e8a23a" stroke-width="2" marker-end="url(#a)"/>
  <text class="lbl" x="700" y="144" text-anchor="middle">state</text>

  <!-- launcher to claude -->
  <line x1="500" y1="172" x2="500" y2="268" stroke="#e8a23a" stroke-width="2" marker-end="url(#a)"/>
  <text class="lbl" x="512" y="212">starts Claude.exe with</text>
  <text class="lbl" x="512" y="230">--user-data-dir=&lt;account folder&gt;</text>

  <!-- claude row -->
  <text class="s" x="30" y="262">Claude Desktop (Store app), never modified</text>
  <rect class="claude" x="130" y="276" width="220" height="86" rx="12" stroke-dasharray="6 4"/>
  <text class="h" x="240" y="308" text-anchor="middle">Default</text>
  <text class="s" x="240" y="330" text-anchor="middle">your normal login</text>
  <text class="s" x="240" y="346" text-anchor="middle">never touched</text>

  <rect class="claude" x="390" y="276" width="220" height="86" rx="12"/>
  <text class="h" x="500" y="308" text-anchor="middle">Account A</text>
  <text class="s" x="500" y="330" text-anchor="middle">own login and data</text>

  <rect class="claude" x="650" y="276" width="220" height="86" rx="12"/>
  <text class="h" x="760" y="308" text-anchor="middle">Account B</text>
  <text class="s" x="760" y="330" text-anchor="middle">own login and data</text>

  <!-- helper to windows -->
  <path d="M850 196 V240 H760 V276" fill="none" stroke="#e8a23a" stroke-width="2" marker-end="url(#a)"/>
  <text class="lbl" x="862" y="226">styles and trims only</text>
  <text class="lbl" x="862" y="242">its own windows</text>

  <!-- watcher observes -->
  <path d="M970 63 H985 V400 H240 V362" fill="none" stroke="#8f877c" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#g)"/>
  <text class="lbl" x="620" y="393" text-anchor="middle">Windows starts Default with each sign-in link; the watcher reads it and the launcher forwards it</text>

  <!-- data -->
  <rect class="box" x="30" y="430" width="940" height="84" rx="12"/>
  <text class="h" x="50" y="460">Data on disk</text>
  <text class="s" x="50" y="482">%APPDATA%\Claude Multi Launcher\profiles\&lt;id&gt;\  one Claude data folder per account</text>
  <text class="s" x="50" y="500">profiles.json, settings.json, launcher.log next to them  •  Default (%APPDATA%\Claude) is only read for its log</text>
</svg>
